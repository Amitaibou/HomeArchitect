version: '3.8'

services:
  app:
    build: ./app
    container_name: home_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./inventory.txt:/app/inventory.txt

  proxy:
    image: nginx:latest
    container_name: home_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./dashboard:/usr/share/nginx/html
    depends_on:
      - app